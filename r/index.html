<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Dialed recipe</title>
<style>
  /* Montserrat, served with the page (SIL Open Font License, fonts/OFL.txt): no third-party requests. */
  @font-face { font-family: "Montserrat"; font-weight: 500; font-display: swap; src: url("../fonts/Montserrat-Medium.ttf") format("truetype"); }
  @font-face { font-family: "Montserrat"; font-weight: 600; font-display: swap; src: url("../fonts/Montserrat-SemiBold.ttf") format("truetype"); }

  /* The app's colours (Shared/Theme.swift): light, and the same roles on warm near-black. */
  :root {
    --canvas:#FBFAF7; --card:#FFFFFF; --tan:#F5F2EB; --hairline:#F1EEE4; --ring:rgba(39,31,27,.06);
    --ink:#271F1B; --muted:#7D7976; --faint:#9E9794;
    --button-top:#3B1902; --button-bottom:#130400; --on-button:#FFFFFF;
    --tick:rgba(39,31,27,.35); --set:#B06A2E; --bean-top:#5A2E10; --bean-bottom:#130400;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas:#15110E; --card:#1F1915; --tan:#2A231E; --hairline:#2E2621; --ring:rgba(0,0,0,.4);
      --ink:#F3EDE6; --muted:#A79E97; --faint:#857C76;
      --button-top:#F6F0E7; --button-bottom:#DACDBB; --on-button:#271F1B;
      --tick:rgba(243,237,230,.4); --set:#D9A066; --bean-top:#F6EEE3; --bean-bottom:#D9C8B2;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--canvas); color:var(--ink);
    font: 500 14px/1.45 "Montserrat", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 440px; margin: 0 auto; display:flex; flex-direction:column; gap:20px; }

  .brand { display:flex; align-items:center; gap:8px; }
  .mark { width:32px; height:32px; flex:none; }
  .mark line { stroke-linecap: round; stroke: var(--tick); }
  .mark line.set { stroke: var(--set); }
  .mark .crease { fill:none; stroke: var(--canvas); stroke-linecap: round; }
  .word { height:18px; width:auto; fill: var(--ink); }
  .method { margin-left:auto; font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }

  .card { background:var(--card); border-radius:20px; box-shadow: 0 0 0 1px var(--ring), 0 1px 1px var(--ring); overflow:hidden; }
  .head { padding:22px 20px 18px; }
  h1 { font-size:24px; font-weight:600; line-height:1.2; margin:0; letter-spacing:-.01em; text-wrap: balance; }
  .sub { margin-top:4px; color:var(--muted); }
  .grind { display:flex; flex-direction:column; padding:18px 20px 20px; background:var(--tan); }
  .grind .label { font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--muted); }
  .grind .value { font-size:64px; font-weight:600; line-height:1.05; letter-spacing:-.02em; }
  .grind .on { color:var(--muted); }
  dl { margin:0; }
  .row { display:flex; justify-content:space-between; gap:16px; padding:13px 20px; border-top:1px solid var(--hairline); }
  dt { color:var(--muted); }
  dd { margin:0; font-weight:600; text-align:right; font-variant-numeric: tabular-nums; }

  .button {
    display:flex; align-items:center; justify-content:center; height:48px; border-radius:999px;
    background: linear-gradient(var(--button-top), var(--button-bottom)); color:var(--on-button);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), 0 0 0 1px var(--ring), 0 10px 16px -8px rgba(39,31,27,.35);
    font-size:16px; font-weight:600; text-decoration:none;
  }
  .note { margin:0; font-size:12px; letter-spacing:.02em; color:var(--faint); text-align:center; text-wrap: balance; }
  .error { text-align:center; color:var(--muted); padding:48px 8px; margin:0; }
</style>
</head>

<script>
// Everything happens in this browser: the recipe is in the part of the link after "#",
// which browsers never send to a server.
const METHODS = { espresso: "Espresso", v60: "Pour over", chemex: "Chemex", aeropress: "AeroPress", "french-press": "French press",
  moka: "Moka pot", "cold-brew": "Cold brew" };
const ROASTS = { light: "Light", mediumLight: "Medium-light", medium: "Medium", mediumDark: "Medium-dark", dark: "Dark" };
const TASTES = { sour: "Sour", thin: "Thin", bitter: "Bitter", harsh: "Harsh", balanced: "Balanced", sweet: "Sweet", strong: "Too strong" };
const GRINDERS = { "niche-zero": "Niche Zero", "mahlkonig-x54": "Mahlkönig X54", "wilfa-uniform": "Wilfa Uniform",
  "timemore-chestnut-s3": "Timemore Chestnut S3", "baratza-encore": "Baratza Encore", "df64-gen2": "DF64 Gen 2",
  "1zpresso-q-air": "1Zpresso Q Air", "comandante-c40": "Comandante C40", "timemore-c2": "Timemore C2 / C3" };

const app = document.getElementById("app");
const text = (tag, content, cls) => { const el = document.createElement(tag); el.textContent = content; if (cls) el.className = cls; return el; };
const num = (v) => Number.isInteger(v) ? String(v) : v.toFixed(1);
// Seconds for a shot, hours for a cold brew's steep, minutes and seconds for the rest.
const duration = (s, method) => method === "espresso" ? `${Math.round(s)} s`
  : s >= 3600 ? `${num(Math.round(s / 360) / 10)} h`
  : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;

async function decode(token) {
  if (!/^[A-Za-z0-9_-]{1,2000}$/.test(token)) throw new Error("bad token");
  const b64 = token.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(token.length / 4) * 4, "=");
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  const json = await new Response(stream).text();
  const r = JSON.parse(json);
  if (!r || typeof r.n !== "string" || typeof r.s !== "number" || typeof r.d !== "number" || typeof r.y !== "number") throw new Error("bad recipe");
  return r;
}

function render(r, token) {
  document.getElementById("method").textContent = METHODS[r.m] ?? r.m;
  document.title = `${r.n} · Dialed recipe`;

  const card = document.createElement("section");
  card.className = "card";
  const head = document.createElement("div");
  head.className = "head";
  head.append(text("h1", r.n));
  const sub = [r.r, ...(r.o ?? []), ROASTS[r.l]].filter(Boolean).join(" · ");
  if (sub) head.append(text("div", sub, "sub"));
  card.append(head);

  const grind = document.createElement("div");
  grind.className = "grind";
  grind.append(text("span", "Grind", "label"), text("span", num(r.s), "value"), text("span", `on ${GRINDERS[r.g] ?? r.g}`, "on"));
  card.append(grind);

  const dl = document.createElement("dl");
  const row = (k, v) => { const div = document.createElement("div"); div.className = "row"; div.append(text("dt", k), text("dd", v)); dl.append(div); };
  row(r.m === "espresso" ? "Coffee in → out" : "Coffee → water", `${num(r.d)} g → ${num(r.y)} g`);
  if (r.t) row(r.m === "espresso" ? "Shot time" : "Total time", duration(r.t, r.m));
  if (r.k) row("Temperature", `${num(r.k)} °C`);
  if (r.q?.length) row("Tasted", r.q.map((t) => TASTES[t] ?? t).join(", "));
  if (r.a != null) row("Brewed", `Day ${r.a} after roast`);
  card.append(dl);

  const open = text("a", "Open in Dialed", "button");
  open.href = `dialed://r#${token}`;
  app.replaceChildren(card, open, text("p", "Dialed converts this setting to your own grinder. Don’t have it yet? Get Dialed on the App Store.", "note"));
  app.style.display = "flex";
  app.style.flexDirection = "column";
  app.style.gap = "16px";
}

(async () => {
  const token = decodeURIComponent(location.hash.slice(1));
  try {
    render(await decode(token), token);
  } catch {
    app.replaceChildren(text("p", "This recipe link is incomplete. Ask for it again, or scan the code on the recipe card.", "error"));
  }
})();
</script>
</body>
</html>
